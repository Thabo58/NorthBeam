<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthBeam | Premium Digital Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 40px; border: 1px solid #333333; background: #0a0a0a; border-radius: 8px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 30px; text-align: center; text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; text-transform: uppercase; color: #888888; margin-bottom: 8px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; background: #111111; border: 1px solid #333333; color: #ffffff; border-radius: 4px; font-size: 16px; }
        input:focus { border-color: #ffffff; outline: none; }
        button { width: 100%; padding: 14px; background: #ffffff; color: #000000; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #cccccc; }
        .hidden { display: none; }
        .dashboard-card { border-top: 1px solid #333333; margin-top: 20px; padding-top: 20px; }
        .vpn-key-box { background: #111111; padding: 15px; border: 1px dashed #555555; text-align: center; font-family: monospace; font-size: 16px; margin: 15px 0; color: #00ff66; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 20px; }
        .nav-links a { color: #888888; font-size: 12px; text-decoration: none; text-transform: uppercase; }
        .nav-links a:hover { color: #ffffff; }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h1>NorthBeam</h1>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        <button id="btn-login">Sign In / Sign Up</button>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden">
        <p style="color: #888888; text-align: center;" id="user-welcome"></p>
        
        <div class="dashboard-card">
            <label>Your Active VPN Key</label>
            <div class="vpn-key-box" id="vpn-key-display">Loading...</div>
        </div>

        <div class="dashboard-card">
            <label>Purchase / Extend Access</label>
            <button id="btn-order-vpn" style="background: transparent; color: #ffffff; border: 1px solid #ffffff; margin-bottom: 10px;">Buy 1 Month (0.00015 BTC)</button>
        </div>

        <!-- WALLET PAYMENT MODAL SIMULATION -->
        <div id="payment-box" class="hidden" style="margin-top: 20px; padding: 15px; background: #111;">
            <label>Send Bitcoin To:</label>
            <input type="text" id="btc-address-field" readonly style="font-size: 12px; margin-bottom: 10px;">
            <p id="btc-amount-field" style="font-size: 14px; margin-bottom: 10px;"></p>
            <input type="text" id="txid-input" placeholder="Enter Transaction ID (TXID) after sending">
            <button id="btn-verify" style="margin-top: 10px;">Verify Payment</button>
        </div>

        <div class="nav-links">
            <a href="#" id="btn-logout">Sign Out</a>
        </div>
    </div>
</div>

<script>
    // Initialize configuration placeholders - Render environment variables will power the backend
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; 
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    const supabase = signUpUrl = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const userWelcome = document.getElementById('user-welcome');
    const vpnKeyDisplay = document.getElementById('vpn-key-display');

    // Handle Authentication (Login/Signup auto-switch)
    document.getElementById('btn-login').addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;

        // Attempt login
        let { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        // If login fails, attempt automatic signup
        if (error) {
            const signup = await supabase.auth.signUp({ email, password });
            if (signup.error) return alert(signup.error.message);
            data = signup.data;
            alert("Account created! Please check your email or log in.");
        }
        
        if (data.user) showDashboard(data.user);
    });

    async function showDashboard(user) {
        authSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        userWelcome.innerText = `Account: ${user.email}`;

        // Fetch VPN Key from DB
        let { data, error } = await supabase.from('profiles').select('vpn_key').eq('id', user.id).single();
        if (data) {
            vpnKeyDisplay.innerText = data.vpn_key;
        } else {
            // Create profile if missing
            await supabase.from('profiles').insert({ id: user.id, email: user.email });
            vpnKeyDisplay.innerText = 'No active VPN key';
        }
    }

    // Handle Bitcoin Checkout Generation
    document.getElementById('btn-order-vpn').addEventListener('click', async () => {
        const session = await supabase.auth.getSession();
        const userId = session.data.session.user.id;

        const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, plan: 'monthly' })
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('payment-box').classList.remove('hidden');
            document.getElementById('btc-address-field').value = data.address;
            document.getElementById('btc-amount-field').innerText = data.message;
        }
    });

    // Handle Payment Verification
    document.getElementById('btn-verify').addEventListener('click', async () => {
        const session = await supabase.auth.getSession();
        const userId = session.data.session.user.id;
        const txid = document.getElementById('txid-input').value;

        const res = await fetch('/api/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, txid })
        });
        const data = await res.json();

        if (data.success) {
            alert("Payment received! Your new VPN key is active.");
            vpnKeyDisplay.innerText = data.vpnKey;
            document.getElementById('payment-box').classList.add('hidden');
        } else {
            alert("Verification failed. Please double check your TXID.");
        }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.reload();
    });
</script>
</body>
</html>
